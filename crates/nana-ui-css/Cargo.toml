[package]
name = "nana-ui-css"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "NanaUI's CSS subset: stylesheet parse, cascade and the mapping onto the Style Model, run at build time by the .vue compiler, view! and css!"
license = "MIT OR Apache-2.0"

[lib]
name = "nana_ui_css"
path = "src/lib.rs"

[dependencies]
nana-ui-core.workspace = true
serde_json.workspace = true
